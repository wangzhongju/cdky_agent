api:
  host: 0.0.0.0
  port: 8000

provider:
  type: dashscope
  model: qwen3-max
  timeout_seconds: 60
  max_retries: 3
  base_delay_seconds: 1
  max_delay_seconds: 30

session:
  recent_message_limit: 12
  max_turns: 8
  history_page_size: 20

context:
  max_prompt_tokens: 12000
  keep_last_messages: 6

permission:
  mode: default
  allowed_tools: []
  denied_tools: []
  denied_commands:
    - "rm -rf *"
    - "shutdown *"
    - "reboot *"
  path_rules: []

infra:
  database_url: ${DATABASE_URL}
  redis_url: ${REDIS_URL}
  redis_queue_key: a2a:task_queue
  redis_dead_letter_key: a2a:dead_letter

a2a:
  worker_poll_seconds: 1
  max_retry: 3

orchestrator:
  max_parallel_capabilities: 4
  model_route_policy: balanced

governance:
  rate_limit_per_minute: 120
  daily_quota: 2000
  metrics_ttl_seconds: 86400
  default_actor: anonymous

observability:
  enable_console_tracing: true
  enable_otlp: false
  otlp_endpoint: ${OTLP_ENDPOINT}
  otlp_insecure: true

cost:
  input_token_ratio: 4
  output_token_ratio: 4
  model_prices:
    qwen3-max:
      input_per_1k: 0.04
      output_per_1k: 0.12
    qwen-plus:
      input_per_1k: 0.008
      output_per_1k: 0.02
