services:
  agent-web:
    image: ${WEB_IMAGE_NAME:-cdky-agent-web:dev}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${WEB_CONTAINER_NAME:-cdky-agent-web}
    hostname: in-dev-docker-web
    environment:
      NEXT_PUBLIC_AGENT_API_BASE_URL: ${NEXT_PUBLIC_AGENT_API_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    depends_on:
      - agent-api
    restart: unless-stopped
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  agent-api:
    image: ${IMAGE_NAME:-cdky-agent-api:dev}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        DOCKER_USERS: ${DOCKER_USERS:-cdky}
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: ${API_CONTAINER_NAME:-cdky-agent-api}
    hostname: in-dev-docker-api
    env_file:
      - .env
    environment:
      AGENT_API_BASE_URL: http://agent-api:8000
      USER: ${DOCKER_USERS:-cdky}
      HOME: /home/${DOCKER_USERS:-cdky}
      DOCKER_USER: ${DOCKER_USERS:-cdky}
      DOCKER_USER_ID: ${USER_ID:-1000}
      DOCKER_GRP: ${DOCKER_USERS:-cdky}
      DOCKER_GRP_ID: ${GROUP_ID:-1000}
      HISTFILE: /app/.dev_bash_history
    user: ${DOCKER_USERS:-cdky}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - /etc/localtime:/etc/localtime:ro
    working_dir: /app
    command: ["python", "api_server.py"]
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    stdin_open: true
    tty: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz?deep=true', timeout=5).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: cdky-agent-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agent}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: cdky-agent-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
  frontend_node_modules:
